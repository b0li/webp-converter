<!DOCTYPE html>
<html lang="de">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebP Converter</title>

	<style>

		*, *::before, *::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg: #1a1d23;
			--surface: #22262e;
			--surface-2: #2a2f39;
			--border: #333844;
			--accent: #d4a55a;
			--accent-dim: rgba( 212, 165, 90, 0.15 );
			--green: #6abf69;
			--red: #e06c6c;
			--text: #e8eaf0;
			--text-dim: #8a909e;
			--radius: 10px;
		}

		body {
			background: var( --bg );
			color: var( --text );
			font-family: 'DM Sans', system-ui, sans-serif;
			min-height: 100vh;
			padding: 32px 16px 64px;
		}

		h1 {
			font-family: 'DM Serif Display', Georgia, serif;
			font-size: 2rem;
			font-weight: 400;
			color: var( --accent );
			text-align: center;
			margin-bottom: 8px;
		}

		.subtitle {
			text-align: center;
			color: var( --text-dim );
			font-size: 0.9rem;
			margin-bottom: 32px;
		}

		/* Drop Zone */

		.drop-zone {
			border: 2px dashed var( --border );
			border-radius: var( --radius );
			background: var( --surface );
			padding: 48px 24px;
			text-align: center;
			cursor: pointer;
			transition: border-color 0.2s, background 0.2s;
			max-width: 720px;
			margin: 0 auto 32px;
		}

		.drop-zone.drag-over {
			border-color: var( --accent );
			background: var( --accent-dim );
		}

		.drop-zone__icon {
			font-size: 3rem;
			margin-bottom: 12px;
			display: block;
		}

		.drop-zone__title {
			font-size: 1.1rem;
			font-weight: 600;
			margin-bottom: 6px;
		}

		.drop-zone__hint {
			color: var( --text-dim );
			font-size: 0.85rem;
		}

		input[type="file"] {
			display: none;
		}

		/* Controls */

		.controls {
			max-width: 720px;
			margin: 0 auto 24px;
			background: var( --surface );
			border-radius: var( --radius );
			padding: 20px 24px;
			display: flex;
			align-items: center;
			gap: 20px;
			flex-wrap: wrap;
		}

		.quality-label {
			font-size: 0.85rem;
			color: var( --text-dim );
			white-space: nowrap;
		}

		.quality-value {
			font-size: 1rem;
			font-weight: 700;
			color: var( --accent );
			min-width: 36px;
			text-align: right;
		}

		input[type="range"] {
			flex: 1;
			min-width: 120px;
			-webkit-appearance: none;
			appearance: none;
			height: 4px;
			border-radius: 2px;
			background: var( --border );
			outline: none;
			cursor: pointer;
		}

		input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: var( --accent );
			cursor: pointer;
		}

		input[type="number"] {
			width: 80px;
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 6px;
			color: var( --text );
			font-family: inherit;
			font-size: 0.9rem;
			padding: 5px 8px;
			outline: none;
			-moz-appearance: textfield;
		}

		input[type="number"]::-webkit-outer-spin-button,
		input[type="number"]::-webkit-inner-spin-button {
			-webkit-appearance: none;
		}

		input[type="number"]:focus {
			border-color: var( --accent );
		}

		input[type="range"]::-moz-range-thumb {
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: var( --accent );
			border: none;
			cursor: pointer;
		}

		.btn {
			padding: 8px 18px;
			border-radius: 6px;
			border: none;
			font-family: inherit;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
			transition: opacity 0.15s;
		}

		.btn:disabled {
			opacity: 0.4;
			cursor: default;
		}

		.btn--accent {
			background: var( --accent );
			color: #1a1d23;
		}

		.btn--ghost {
			background: var( --surface-2 );
			color: var( --text-dim );
			border: 1px solid var( --border );
		}

		.btn--danger {
			background: transparent;
			color: var( --red );
			border: 1px solid var( --red );
		}

		.btn:not(:disabled):hover {
			opacity: 0.85;
		}

		/* File List */

		.file-list {
			max-width: 720px;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.file-list:empty {
			display: none;
		}

		.file-actions {
			max-width: 720px;
			margin: 0 auto 16px;
			display: flex;
			gap: 10px;
			justify-content: flex-end;
		}

		.file-actions:empty {
			display: none;
		}

		/* File Item */

		.file-item {
			background: var( --surface );
			border-radius: var( --radius );
			padding: 14px 16px;
			display: grid;
			grid-template-columns: 52px 1fr auto;
			align-items: center;
			gap: 14px;
			border: 1px solid var( --border );
			transition: border-color 0.2s;
		}

		.file-item--done {
			border-color: var( --green );
		}

		.file-item--error {
			border-color: var( --red );
		}

		.file-item__thumb {
			width: 52px;
			height: 52px;
			border-radius: 6px;
			object-fit: cover;
			background: var( --surface-2 );
			display: flex;
			align-items: center;
			justify-content: center;
			color: var( --text-dim );
			font-size: 0.7rem;
			overflow: hidden;
		}

		.file-item__thumb img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.file-item__info {
			min-width: 0;
		}

		.file-item__name {
			font-size: 0.9rem;
			font-weight: 600;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			margin-bottom: 4px;
		}

		.file-item__meta {
			font-size: 0.78rem;
			color: var( --text-dim );
			display: flex;
			align-items: center;
			gap: 6px;
			flex-wrap: wrap;
		}

		.size-arrow {
			color: var( --accent );
		}

		.size-saving {
			color: var( --green );
			font-weight: 600;
		}

		.file-item__status {
			font-size: 0.8rem;
			font-weight: 600;
			margin-top: 4px;
		}

		.file-item__status--processing { color: var( --accent ); }
		.file-item__status--done { color: var( --green ); }
		.file-item__status--error { color: var( --red ); }

		.file-item__actions {
			display: flex;
			flex-direction: column;
			gap: 6px;
			align-items: flex-end;
		}

		.btn--download {
			background: var( --green );
			color: #1a1d23;
			font-size: 0.78rem;
			padding: 6px 12px;
		}

		.btn--remove {
			background: transparent;
			border: none;
			color: var( --text-dim );
			font-size: 1.1rem;
			cursor: pointer;
			padding: 2px 4px;
			line-height: 1;
			transition: color 0.15s;
		}

		.btn--remove:hover {
			color: var( --red );
		}

		/* Progress */

		.progress-bar {
			width: 100%;
			height: 3px;
			background: var( --border );
			border-radius: 2px;
			margin-top: 8px;
			overflow: hidden;
		}

		.progress-bar__fill {
			height: 100%;
			background: var( --accent );
			border-radius: 2px;
			transition: width 0.3s;
			width: 0%;
		}

		/* Google Fonts */

		@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600;700&display=swap');

	</style>

</head>
<body>

	<h1>WebP Converter</h1>
	<p class="subtitle">Bilder per Drag & Drop in WebP konvertieren — lokal, kein Upload</p>

	<div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Bilder hierher ziehen oder klicken zum Auswählen">
		<div class="drop-zone__title">Bilder hier ablegen</div>
		<div class="drop-zone__hint">JPG, PNG, GIF, AVIF, BMP · Mehrere Dateien gleichzeitig · Klicken zum Auswählen</div>
	</div>

	<input type="file" id="fileInput" multiple accept="image/*">

	<div class="controls">

		<span class="quality-label">Qualität</span>

		<input
			type="range"
			id="qualitySlider"
			min="1"
			max="100"
			value="70"
			aria-label="WebP Qualität"
		>

		<span class="quality-value" id="qualityValue">70</span>

		<span class="quality-label" style="margin-left:8px">Breite</span>

		<input
			type="number"
			id="widthInput"
			min="1"
			max="10000"
			placeholder="px"
			aria-label="Zielbreite in Pixeln (leer = Originalgröße)"
		>

	</div><!-- end /.controls -->

	<div class="file-actions" id="fileActions">
		<button class="btn btn--ghost" id="clearBtn" aria-label="Alle Dateien entfernen">Alle löschen</button>
		<button class="btn btn--accent" id="downloadAllBtn" aria-label="Alle als ZIP herunterladen">Alle als ZIP</button>
	</div><!-- end /.file-actions -->

	<div class="file-list" id="fileList" role="list" aria-label="Konvertierte Dateien"></div><!-- end /.file-list -->

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

	<script>

		(function() {

			'use strict';

			const dropZone = document.getElementById( 'dropZone' );
			const fileInput = document.getElementById( 'fileInput' );
			const qualitySlider = document.getElementById( 'qualitySlider' );
			const qualityValue = document.getElementById( 'qualityValue' );
			const widthInput = document.getElementById( 'widthInput' );
			const fileList = document.getElementById( 'fileList' );
			const fileActions = document.getElementById( 'fileActions' );
			const clearBtn = document.getElementById( 'clearBtn' );
			const downloadAllBtn = document.getElementById( 'downloadAllBtn' );

			let files = [];

			// Quality slider

			qualitySlider.addEventListener( 'input', () => {
				qualityValue.textContent = qualitySlider.value;
			});

			// Drop zone events

			dropZone.addEventListener( 'click', () => fileInput.click() );

			dropZone.addEventListener( 'keydown', ( e ) => {
				if ( e.key === 'Enter' || e.key === ' ' ) fileInput.click();
			});

			dropZone.addEventListener( 'dragover', ( e ) => {
				e.preventDefault();
				dropZone.classList.add( 'drag-over' );
			});

			dropZone.addEventListener( 'dragleave', ( e ) => {
				if ( ! dropZone.contains( e.relatedTarget ) ) {
					dropZone.classList.remove( 'drag-over' );
				}
			});

			dropZone.addEventListener( 'drop', ( e ) => {
				e.preventDefault();
				dropZone.classList.remove( 'drag-over' );
				handleFiles( e.dataTransfer.files );
			});

			fileInput.addEventListener( 'change', () => {
				handleFiles( fileInput.files );
				fileInput.value = '';
			});

			// File handling

			function handleFiles( rawFiles ) {

				const quality = parseInt( qualitySlider.value, 10 ) / 100;
				const targetWidth = parseInt( widthInput.value, 10 ) || 0;

				Array.from( rawFiles ).forEach( ( file ) => {

					if ( ! file.type.startsWith( 'image/' ) ) {
						addErrorItem( file.name, 'Kein Bildformat' );
						return;
					}

					const id = Date.now() + Math.random();
					const item = addPendingItem( file, id );

					convertToWebP( file, quality, targetWidth, id, item );
				});

				updateActions();

			}

			function convertToWebP( file, quality, targetWidth, id, item ) {

				const reader = new FileReader();

				reader.onload = ( e ) => {

					const img = new Image();

					img.onload = () => {

						const origW = img.naturalWidth;
						const origH = img.naturalHeight;

						// Determine output dimensions
						let outW = origW;
						let outH = origH;
						let notUpscaled = false;

						if ( targetWidth > 0 ) {
							if ( targetWidth < origW ) {
								outW = targetWidth;
								outH = Math.round( origH * ( targetWidth / origW ) );
							} else {
								notUpscaled = true;
							}
						}

						const canvas = document.createElement( 'canvas' );
						canvas.width = outW;
						canvas.height = outH;

						const ctx = canvas.getContext( '2d' );
						ctx.drawImage( img, 0, 0, outW, outH );

						canvas.toBlob( ( blob ) => {

							if ( ! blob ) {
								markError( item, 'Konvertierung fehlgeschlagen' );
								return;
							}

							const originalName = file.name.replace( /\.[^.]+$/, '' ) + '.webp';
							const url = URL.createObjectURL( blob );

							files.push({ id, name: originalName, blob, url });

							markDone( item, file, blob, url, originalName, origW, origH, outW, outH, notUpscaled );

						}, 'image/webp', quality );

					};

					img.onerror = () => markError( item, 'Bild konnte nicht geladen werden' );
					img.src = e.target.result;

				};

				reader.onerror = () => markError( item, 'Datei konnte nicht gelesen werden' );
				reader.readAsDataURL( file );

			}

			// DOM helpers

			function addPendingItem( file, id ) {

				const item = document.createElement( 'div' );
				item.className = 'file-item';
				item.dataset.id = id;
				item.setAttribute( 'role', 'listitem' );

				item.innerHTML = `
					<div class="file-item__thumb" aria-hidden="true">…</div>
					<div class="file-item__info">
						<div class="file-item__name">${ escapeHtml( file.name ) }</div>
						<div class="file-item__meta">${ formatBytes( file.size ) }</div>
						<div class="file-item__status file-item__status--processing">Konvertiere…
							<div class="progress-bar"><div class="progress-bar__fill" style="width:60%"></div></div>
						</div>
					</div>
					<div class="file-item__actions">
						<button class="btn--remove" aria-label="Entfernen" data-id="${ id }">✕</button>
					</div>
				`;

				fileList.appendChild( item );

				item.querySelector( '.btn--remove' ).addEventListener( 'click', () => removeItem( id ) );

				return item;

			}

			function addErrorItem( name, msg ) {

				const id = Date.now() + Math.random();
				const item = document.createElement( 'div' );
				item.className = 'file-item file-item--error';
				item.dataset.id = id;
				item.setAttribute( 'role', 'listitem' );

				item.innerHTML = `
					<div class="file-item__thumb" aria-hidden="true">⚠️</div>
					<div class="file-item__info">
						<div class="file-item__name">${ escapeHtml( name ) }</div>
						<div class="file-item__status file-item__status--error">${ escapeHtml( msg ) }</div>
					</div>
					<div class="file-item__actions">
						<button class="btn--remove" aria-label="Entfernen" data-id="${ id }">✕</button>
					</div>
				`;

				fileList.appendChild( item );
				item.querySelector( '.btn--remove' ).addEventListener( 'click', () => removeItem( id ) );

				updateActions();

			}

			function markDone( item, originalFile, blob, url, webpName, origW, origH, outW, outH, notUpscaled ) {

				const saving = Math.round( ( 1 - blob.size / originalFile.size ) * 100 );
				const savingText = saving > 0
					? `<span class="size-saving">−${ saving }%</span>`
					: `<span style="color:var(--text-dim)">${ saving }%</span>`;

				const resized = origW !== outW || origH !== outH;
				const dimText = resized
					? `<span class="size-arrow">·</span> ${ origW }×${ origH } <span class="size-arrow">→</span> ${ outW }×${ outH }`
					: `<span class="size-arrow">·</span> ${ origW }×${ origH }`;

				const notUpscaledText = notUpscaled
					? `<span style="color:var(--text-dim)" title="Bild ist schmaler als Zielbreite">· Nicht vergrößert</span>`
					: '';

				const thumb = item.querySelector( '.file-item__thumb' );
				thumb.innerHTML = `<img src="${ url }" alt="${ escapeHtml( webpName ) }">`;

				item.querySelector( '.file-item__meta' ).innerHTML = `
					${ formatBytes( originalFile.size ) }
					<span class="size-arrow">→</span>
					${ formatBytes( blob.size ) }
					${ savingText }
					${ dimText }
					${ notUpscaledText }
				`;

				item.querySelector( '.file-item__status' ).remove();

				item.querySelector( '.file-item__actions' ).innerHTML = `
					<a
						href="${ url }"
						download="${ escapeHtml( webpName ) }"
						class="btn btn--download"
						aria-label="${ escapeHtml( webpName ) } herunterladen"
					>↓ WebP</a>
					<button class="btn--remove" aria-label="Entfernen" data-id="${ item.dataset.id }">✕</button>
				`;

				item.querySelector( '.btn--remove' ).addEventListener( 'click', () => removeItem( +item.dataset.id ) );
				item.classList.add( 'file-item--done' );

			}

			function markError( item, msg ) {

				item.classList.add( 'file-item--error' );
				item.querySelector( '.file-item__status' ).className = 'file-item__status file-item__status--error';
				item.querySelector( '.file-item__status' ).textContent = msg;

			}

			function removeItem( id ) {

				const item = document.querySelector( `.file-item[data-id="${ id }"]` );
				if ( item ) item.remove();

				const idx = files.findIndex( f => f.id === id );
				if ( idx !== -1 ) {
					URL.revokeObjectURL( files[idx].url );
					files.splice( idx, 1 );
				}

				updateActions();

			}

			function updateActions() {

				const hasItems = fileList.children.length > 0;
				fileActions.style.display = hasItems ? 'flex' : 'none';

			}

			// ZIP download

			downloadAllBtn.addEventListener( 'click', async () => {

				if ( ! files.length ) return;

				downloadAllBtn.disabled = true;
				downloadAllBtn.textContent = 'Packe ZIP…';

				try {

					const zip = new JSZip();

					files.forEach( ( f ) => {
						zip.file( f.name, f.blob );
					});

					const content = await zip.generateAsync({ type: 'blob' });
					const url = URL.createObjectURL( content );
					const a = document.createElement( 'a' );
					a.href = url;
					a.download = 'webp-converted.zip';
					a.click();
					URL.revokeObjectURL( url );

				} finally {

					downloadAllBtn.disabled = false;
					downloadAllBtn.textContent = 'Alle als ZIP';

				}

			});

			// Clear all

			clearBtn.addEventListener( 'click', () => {

				files.forEach( f => URL.revokeObjectURL( f.url ) );
				files = [];
				fileList.innerHTML = '';
				updateActions();

			});

			// Utils

			function formatBytes( bytes ) {

				if ( bytes < 1024 ) return bytes + ' B';
				if ( bytes < 1024 * 1024 ) return ( bytes / 1024 ).toFixed( 1 ) + ' KB';
				return ( bytes / ( 1024 * 1024 ) ).toFixed( 2 ) + ' MB';

			}

			function escapeHtml( str ) {

				return str
					.replace( /&/g, '&amp;' )
					.replace( /</g, '&lt;' )
					.replace( />/g, '&gt;' )
					.replace( /"/g, '&quot;' );

			}

			updateActions();

		})();

	</script>

</body>
</html>
